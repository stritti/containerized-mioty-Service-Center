# OpenTelemetry Collector Configuration for BSSCI Service Center
#
# This configuration sets up an OpenTelemetry Collector that:
#   - Accepts traces, metrics, and logs via OTLP (gRPC on 4317, HTTP on 4318)
#   - Exports Prometheus-formatted metrics on port 8889
#   - Logs all received telemetry to stdout for debugging
#
# To forward data to additional backends (Jaeger, Grafana Tempo, Datadog, etc.)
# add the appropriate exporter blocks and reference them in the pipelines below.
# See: https://opentelemetry.io/docs/collector/configuration/

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317   # OTLP gRPC endpoint
      http:
        endpoint: 0.0.0.0:4318   # OTLP HTTP endpoint

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024

exporters:
  debug:
    verbosity: normal             # Log received telemetry to stdout
  prometheus:
    endpoint: "0.0.0.0:8889"     # Prometheus scrape endpoint

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, prometheus]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
